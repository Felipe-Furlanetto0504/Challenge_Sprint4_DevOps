  <text x="40" y="80" font-size="15" fill="#4B5563">Challenge FIAP 2026 (Clyvo Vet) · Sprint 4 · DevOps Tools &amp; Cloud Computing · Java Spring Boot no Azure Web App + Oracle da FIAP</text>

