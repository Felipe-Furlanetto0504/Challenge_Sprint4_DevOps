  <rect x="625" y="560" width="570" height="252" rx="12" fill="#F4FAFF" stroke="#4A9BE0" stroke-dasharray="6 4"/>
  <text x="641" y="582" font-size="12.5" font-weight="700" fill="#004E8C">App Service Plan · plan-futurevet-562074 (Linux B1)</text>
  <rect x="655" y="596" width="510" height="200" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
  <text x="673" y="622" font-size="15" font-weight="700" fill="#111827">Azure Web App · futurevet-562074</text>
  <text x="673" y="641" font-size="12" fill="#4B5563">Java 17 (Java SE) · Spring Boot 3.5 · https://futurevet-562074.azurewebsites.net</text>
  <rect x="673" y="654" width="232" height="56" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="685" y="676" font-size="12" font-weight="700" fill="#111827">Web (Thymeleaf)</text>
  <text x="685" y="696" font-size="11.5" fill="#374151">pets, vacinas, consultas</text>
  <rect x="915" y="654" width="232" height="56" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="927" y="676" font-size="12" font-weight="700" fill="#111827">API REST /api (JWT)</text>
  <text x="927" y="696" font-size="11.5" fill="#374151">consumida pelo app mobile</text>
  <rect x="673" y="718" width="232" height="60" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="685" y="740" font-size="12" font-weight="700" fill="#111827">Spring Security · Flyway</text>
  <text x="685" y="760" font-size="11.5" fill="#374151">perfis TUTOR / ADMIN</text>
  <rect x="915" y="718" width="232" height="60" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="927" y="740" font-size="12" font-weight="700" fill="#111827">Actuator · App Settings</text>
  <text x="927" y="760" font-size="11.5" fill="#374151">health, info, logs</text>

  <!-- ============ ORACLE FIAP ============ -->
  <rect x="1260" y="500" width="300" height="175" rx="14" fill="#FDEEEC" stroke="#C74634" stroke-width="2"/>
  <text x="1280" y="528" font-size="15" font-weight="700" fill="#8A2A1D">Banco em nuvem · Oracle FIAP</text>
  <text x="1280" y="546" font-size="12" fill="#8A4A40">PaaS aceito pela disciplina</text>
  <g transform="translate(1280,560)">
    <ellipse cx="22" cy="8" rx="22" ry="8" fill="#FFFFFF" stroke="#C74634" stroke-width="1.6"/>
    <path d="M0,8 v34 a22,8 0 0 0 44,0 v-34" fill="#FFFFFF" stroke="#C74634" stroke-width="1.6"/>
    <path d="M0,25 a22,8 0 0 0 44,0" fill="none" stroke="#C74634" stroke-width="1.2"/>
  </g>
  <text x="1338" y="576" font-size="12" fill="#111827">oracle.fiap.com.br:1521/ORCL</text>
  <text x="1338" y="594" font-size="12" fill="#111827">schema versionado (Flyway)</text>
  <text x="1280" y="630" font-size="11.5" fill="#374151">TB_USUARIO · TB_ANIMAL · TB_VACINA</text>
  <text x="1280" y="648" font-size="11.5" fill="#374151">TB_CONSULTA · TB_FV_NOTIFICACAO</text>

  <!-- ============ RENDER / IA ============ -->
  <rect x="1260" y="700" width="300" height="130" rx="14" fill="#F1EDFB" stroke="#6E56CF" stroke-width="2"/>
  <text x="1280" y="728" font-size="15" font-weight="700" fill="#45309A">Microsserviço futurevet-ia</text>
  <text x="1280" y="746" font-size="12" fill="#5B4A9E">Render · Spring AI</text>
  <text x="1280" y="772" font-size="12" fill="#111827">assistente veterinário com o</text>
  <text x="1280" y="790" font-size="12" fill="#111827">histórico do pet como contexto</text>
  <text x="1280" y="814" font-size="11.5" fill="#4B5563">LLM Groq (llama-3.3-70b)</text>

  <!-- ============ SETAS CI/CD (laranja, numeradas) ============ -->
  <!-- 1 push -->
  <path d="M175,200 H278" stroke="#D9480F" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
  <text x="226" y="190" font-size="11.5" fill="#D9480F" text-anchor="middle">git push</text>
  <!-- 2 gatilho CI -->
  <path d="M550,240 H623" stroke="#D9480F" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
  <text x="573" y="230" font-size="11.5" fill="#D9480F" text-anchor="middle">trigger</text>
  <!-- 4 publica artefato -->
  <path d="M914,376 C940,376 935,240 953,240" stroke="#D9480F" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
  <!-- 5 dispara CD -->
  <path d="M1120,232 H1143" stroke="#D9480F" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
  <!-- 6 segredos -->
  <path d="M1120,370 C1135,370 1135,288 1159,288" stroke="#D9480F" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#seta)"/>
  <!-- 7 deploy -->
  <path d="M1340,430 V470 H1080 V594" stroke="#D9480F" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
  <text x="1210" y="462" font-size="11.5" fill="#D9480F" text-anchor="middle">az webapp deploy (futurevet.jar)</text>

  <!-- Professor acompanha -->
  <path d="M175,430 H598" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#setaCinza)"/>
  <text x="390" y="420" font-size="11.5" fill="#6B7280" text-anchor="middle">avalia boards, repos, pipelines e testes</text>

  <!-- ============ SETAS DE USO (verde, letras) ============ -->
  <!-- A usuário -> web app -->
  <path d="M175,700 H653" stroke="#2B8A3E" stroke-width="2.5" fill="none" marker-end="url(#setaVerde)"/>
  <text x="390" y="690" font-size="11.5" fill="#2B8A3E" text-anchor="middle">HTTPS (navegador / app mobile)</text>
  <!-- B web app -> oracle -->
  <path d="M1165,625 H1258" stroke="#2B8A3E" stroke-width="2.5" fill="none" marker-end="url(#setaVerde)"/>
  <text x="1240" y="615" font-size="11" fill="#2B8A3E" text-anchor="middle">JDBC</text>
  <!-- C web app -> IA -->
  <path d="M1165,765 H1258" stroke="#2B8A3E" stroke-width="2.5" fill="none" marker-end="url(#setaVerde)"/>
  <text x="1240" y="755" font-size="11" fill="#2B8A3E" text-anchor="middle">Feign</text>

  <!-- ============ BADGES ============ -->
  <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="226" cy="214" r="12" fill="#D9480F"/><text x="226" y="219">1</text>
    <circle cx="586" cy="254" r="12" fill="#D9480F"/><text x="586" y="259">2</text>
    <circle cx="903" cy="310" r="12" fill="#D9480F"/><text x="903" y="315">3</text>
    <circle cx="942" cy="320" r="12" fill="#D9480F"/><text x="942" y="325">4</text>
    <circle cx="1132" cy="208" r="12" fill="#D9480F"/><text x="1132" y="213">5</text>
    <circle cx="1132" cy="330" r="12" fill="#D9480F"/><text x="1132" y="335">6</text>
    <circle cx="1352" cy="452" r="12" fill="#D9480F"/><text x="1352" y="457">7</text>
    <circle cx="1508" cy="376" r="12" fill="#D9480F"/><text x="1508" y="381">8</text>
    <circle cx="410" cy="714" r="12" fill="#2B8A3E"/><text x="410" y="719">A</text>
    <circle cx="1212" cy="642" r="12" fill="#2B8A3E"/><text x="1212" y="647">B</text>
    <circle cx="1212" cy="782" r="12" fill="#2B8A3E"/><text x="1212" y="787">C</text>
  </g>

  <!-- ============ LEGENDA ============ -->
  <line x1="40" y1="860" x2="1560" y2="860" stroke="#E5E7EB" stroke-width="2"/>
  <text x="40" y="892" font-size="15" font-weight="700" fill="#D9480F">Esteira CI/CD (ordem de execução)</text>
  <g font-size="12.5" fill="#111827">
    <text x="40" y="918">1  Desenvolvedor altera o código e faz git push na branch master do GitHub.</text>
    <text x="40" y="940">2  O push dispara automaticamente o pipeline no Azure DevOps (trigger: master).</text>
    <text x="40" y="962">3  CI: Maven compila o projeto com JDK 17 e roda os testes JUnit; resultados vão para a aba Tests.</text>
    <text x="40" y="984">4  CI: com os testes verdes, o futurevet.jar é publicado como artefato (futurevet-jar).</text>
    <text x="40" y="1006">5  CD: o estágio de deploy só inicia depois que o artefato novo existe (dependsOn: CI).</text>
    <text x="40" y="1028">6  CD: lê as variáveis protegidas do Variable Group futurevet-secrets (cadeado, valores mascarados).</text>
    <text x="40" y="1050">7  CD: Azure CLI aplica as App Settings e publica o .jar no Azure Web App (az webapp deploy).</text>
    <text x="40" y="1072">8  CD: health check em /actuator/health confirma a aplicação UP com o banco conectado.</text>
  </g>
  <text x="900" y="892" font-size="15" font-weight="700" fill="#2B8A3E">Uso da aplicação</text>
  <g font-size="12.5" fill="#111827">
    <text x="900" y="918">A  Tutor e clínica acessam o FutureVet por HTTPS (web e API REST com JWT).</text>
    <text x="900" y="940">B  O Web App faz o CRUD de pets, vacinas e consultas no Oracle da FIAP via JDBC.</text>
    <text x="900" y="962">C  O assistente de IA é chamado via OpenFeign no microsserviço futurevet-ia.</text>
  </g>
  <text x="900" y="1000" font-size="15" font-weight="700" fill="#374151">Ferramentas</text>
  <g font-size="12.5" fill="#111827">
    <text x="900" y="1026">GitHub (código) · Azure DevOps (pipelines, library, environments, testes)</text>
    <text x="900" y="1048">Maven + JUnit (build e testes) · Azure CLI (infra e deploy) · App Service (execução)</text>
    <text x="900" y="1070">Oracle FIAP (dados) · Render (microsserviço de IA) · Actuator (monitoramento)</text>
  </g>
</svg>
