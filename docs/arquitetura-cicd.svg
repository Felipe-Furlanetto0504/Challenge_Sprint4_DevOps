  <text x="970" y="348" font-size="11.5" fill="#4B5563">futurevet-secrets</text>
  <rect x="970" y="358" width="14" height="11" rx="2" fill="#374151"/>
  <path d="M973,358 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text x="990" y="368" font-size="11.5" fill="#111827">DB_USER</text>
  <text x="990" y="386" font-size="11.5" fill="#111827">DB_PASSWORD</text>
  <text x="990" y="404" font-size="11.5" fill="#111827">JWT_SECRET</text>
  <text x="970" y="421" font-size="11" fill="#4B5563">+ DB_URL</text>

  <!-- CD -->
  <rect x="1145" y="172" width="395" height="258" rx="12" fill="#FFFFFF" stroke="#0B5CAD"/>
  <text x="1161" y="196" font-size="14" font-weight="700" fill="#0B3D73">Estágio CD</text>
  <text x="1161" y="213" font-size="11.5" fill="#4B5563">environment futurevet-producao · só após o CI</text>
  <rect x="1161" y="226" width="363" height="36" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="1175" y="249" font-size="12.5" fill="#111827">Download do artefato novo</text>
  <rect x="1161" y="270" width="363" height="36" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="1175" y="293" font-size="12.5" fill="#111827">Azure CLI: App Settings com os segredos</text>
  <rect x="1161" y="314" width="363" height="36" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="1175" y="337" font-size="12.5" fill="#111827">Azure CLI: az webapp deploy --type jar</text>
  <rect x="1161" y="358" width="363" height="36" rx="8" fill="#F5F8FC" stroke="#C9D8EA"/>
  <text x="1175" y="381" font-size="12.5" fill="#111827">Health check /actuator/health = UP</text>
  <text x="1161" y="417" font-size="11.5" fill="#4B5563">service connection sc-azure-futurevet (ARM)</text>

  <!-- ============ AZURE ============ -->
  <rect x="600" y="500" width="620" height="330" rx="14" fill="#E7F3FF" stroke="#0078D4" stroke-width="2"/>
