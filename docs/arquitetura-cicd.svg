  <g transform="translate(130,200)"><use href="#pessoa"/></g>
  <text x="130" y="250" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Desenvolvedor</text>
  <text x="130" y="268" font-size="12" fill="#4B5563" text-anchor="middle">integrantes do grupo</text>
  <text x="130" y="284" font-size="12" fill="#4B5563" text-anchor="middle">IDE + Git</text>

  <g transform="translate(130,430)"><use href="#pessoa"/></g>
