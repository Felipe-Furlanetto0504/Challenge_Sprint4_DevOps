  <text x="130" y="498" font-size="12" fill="#4B5563" text-anchor="middle">acesso Basic +</text>
  <text x="130" y="514" font-size="12" fill="#4B5563" text-anchor="middle">admin do projeto</text>

  <g transform="translate(130,700)"><use href="#pessoa"/></g>
